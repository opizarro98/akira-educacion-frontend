<div class="ms-auto">
  <ul class="list-unstyled">
    <li>
      <div class="pc-h-item header-user-profile" ngbDropdown>
        <a class="pc-head-link head-link-primary arrow-none me-0" href="javascript:void(0)" ngbDropdownToggle>
          <span class="user-avtar bg-light-primary d-inline-flex align-items-center justify-content-center">
            <i class="ti ti-user"></i>
          </span>
          <span>
            <i class="ti ti-chevron-down"></i>
          </span>
        </a>
        <div class="dropdown-user-profile dropdown-menu-end pc-h-dropdown" ngbDropdownMenu>
          <div class="dropdown-header">
            <h4>{{ auth.user()?.fullName }}</h4>
            <p class="text-muted mb-1">{{ auth.roleLabel() }}</p>
            @if (auth.user()?.institutionName) {
            <p class="text-muted">{{ auth.user()?.institutionName }}</p>
            }
            <hr />
            <button type="button" class="dropdown-item" (click)="logout()">
              <i class="ti ti-logout"></i>
              <span>Cerrar sesión</span>
            </button>
          </div>
        </div>
      </div>
    </li>
  </ul>
</div>
